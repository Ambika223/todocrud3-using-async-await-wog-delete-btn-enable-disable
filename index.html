<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoCrud3 using async-await without generic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container py-5">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Todocrud3</h3>
                    </div>

                    <div class="card-body">
                        <form action="" id="todoForm">
                            <div class="form-group">
                                <label for="todoItem">Enter TodoItem</label>
                                <input type="text" id="todoItem" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="todoDescription">Enter TodoDescrption</label>
                                <textArea id="todoDescription" class="form-control" required></textArea>
                            </div>

                            <div class="form-group">
                                <label for="isCompleted">isCompleted</label>
                                <select name="isCompleted" id="isCompleted" class="form-control">
                                    <option value="" selected disabled>select</option>
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-block btn-sm btn-primary"
                                id="addTodoBtn">AddTodoBtn</button>
                            <button type="button" class="btn btn-block btn-sm btn-success d-none"
                                id="updateTodoBtn">UpdateTodoBtn</button>
                        </form>
                    </div>
                </div>
            </div>


            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4>My Todo List</h4>
                    </div>
                    <div class="card-body">
                        <ul id="todoContainer">
                            <li class="list-group-item">
                                <div class="d-flex justify-content-between" onclick="onTodoDescription(this)">
                                    <div>
                                        <input type="checkbox" onclick="event.stopPropagation(); onCheck(this)">
                                        <strong>HTML</strong>
                                    </div>
                                    <div>
                                        <button class=" btn btn-info btn-sm"
                                            onclick="event.stopPropagation(); onEdit(this)">Edit</button>
                                        <button class="btn btn-danger btn-sm"
                                            onclick="event.stopPropagation(); onRemove(this)">Remove</button>
                                    </div>
                                </div>
                                <div class="collapse">
                                    <div class="card-body"> HyperText Markup Language</div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-dark" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
